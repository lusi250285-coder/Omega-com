<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>حاسوب أوميغا الهرمي - النسخة الاحترافية</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-soft: #eef4ff;
            --border-color: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent-blue: #2563eb;
            --accent-green: #16a34a;
            --accent-orange: #d97706;
            --accent-red: #dc2626;
            --shadow-soft: 0 10px 25px rgba(15, 23, 42, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        html, body {
            height: 100%;
            background-color: var(--bg-primary);
            color: var(--text-main);
        }

        body {
            display: flex;
            min-height: 100vh;
            overflow: hidden;
        }

        aside {
            width: 340px;
            background: linear-gradient(180deg, var(--bg-secondary), #f1f5f9);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
        }

        .brand-box {
            margin-bottom: 24px;
            padding: 10px 8px;
        }

        .brand-box h1 {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .brand-box p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .section-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            margin: 16px 0 10px;
            text-transform: uppercase;
            letter-spacing: 0.7px;
        }

        .future-option-card {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px 12px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.02);
        }

        .future-option-card:hover,
        .future-option-card:focus-visible {
            border-color: var(--accent-blue);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.08);
            transform: translateY(-1px);
            outline: none;
        }

        .future-option-card h3 {
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .future-option-card p {
            font-size: 0.82rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            height: 100%;
        }

        header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            gap: 16px;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .search-box form {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .search-box input {
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.9rem;
            width: min(320px, 60vw);
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            background: white;
        }

        .search-box input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .search-box button {
            padding: 9px 16px;
            background: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .search-box button:hover {
            background: #1d4ed8;
        }

        .search-box button:active {
            transform: translateY(1px);
        }

        .secondary-btn {
            padding: 9px 14px;
            background: var(--bg-soft);
            color: var(--accent-blue);
            border: 1px solid #dbeafe;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .secondary-btn:hover {
            background: #dfeeff;
        }

        .status-indicator {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--accent-green);
            white-space: nowrap;
        }

        .dashboard-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 20px;
            overflow-y: auto;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }

        .metric-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 16px;
            box-shadow: 0 2px 10px rgba(15, 23, 42, 0.02);
        }

        .metric-card span {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .metric-card h2 {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--text-main);
        }

        #map {
            width: 100%;
            height: 420px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: #e2e8f0;
            overflow: hidden;
            z-index: 1;
        }

        .toast {
            position: fixed;
            right: 24px;
            bottom: 24px;
            background: rgba(15, 23, 42, 0.9);
            color: white;
            padding: 12px 16px;
            border-radius: 999px;
            box-shadow: var(--shadow-soft);
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px);
            transition: all 0.25s ease;
            z-index: 9999;
            font-size: 0.85rem;
            max-width: 320px;
        }

        .toast.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .toast.success {
            background: rgba(22, 163, 74, 0.95);
        }

        .toast.error {
            background: rgba(220, 38, 38, 0.95);
        }

        .toast.info {
            background: rgba(37, 99, 235, 0.95);
        }

        @media (max-width: 900px) {
            body {
                flex-direction: column;
                overflow: auto;
            }

            aside {
                width: 100%;
                border-left: none;
                border-bottom: 1px solid var(--border-color);
            }

            main {
                min-height: 70vh;
            }

            header {
                flex-direction: column;
                align-items: stretch;
            }

            .search-box {
                width: 100%;
            }

            .search-box form {
                width: 100%;
            }

            .search-box input {
                width: 100%;
            }
        }
    </style>
</head>
<body>

        <div class="brand-box">
            <h1>حاسوب أوميغا الهرمي</h1>
            <p>منصة القيادة والاستشراف الاستراتيجي</p>
        </div>

        <div class="section-title">خيارات استشراف المستقبل</div>
